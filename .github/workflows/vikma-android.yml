name: Build VIKMA Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/vikma-mobile/**'
      - '.github/workflows/vikma-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/vikma-mobile
        run: npm install
      - name: Add Android platform and sync web app
        working-directory: apps/vikma-mobile
        run: npx cap add android && npx cap sync android
      - name: Build debug APK
        working-directory: apps/vikma-mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: vikma-android-debug-apk
          path: apps/vikma-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
