name: Generate VIKMA Upload Key

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Keystore with OpenSSL
        shell: bash
        run: |
          set +e
          set +o pipefail
          echo START

          STORE_PASS=$(openssl rand -hex 12)
          echo PASS_OK

          echo STEP1_GEN_KEY
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out key.pem
          echo KEY_PEM_DONE
          ls -lh key.pem

          echo STEP2_GEN_CERT
          openssl req -new -x509 -key key.pem -out cert.pem -days 10000 -subj "/C=LK/O=VIKMA/CN=VIKMA"
          echo CERT_DONE
          ls -lh cert.pem

          echo STEP3_MAKE_PKCS12
          openssl pkcs12 -export -out vikma-upload.keystore -inkey key.pem -in cert.pem -name vikma-upload -passout pass:$STORE_PASS
          echo PKCS12_DONE
          ls -lh vikma-upload.keystore

          echo STEP4_MAKE_BASE64
          openssl base64 -in vikma-upload.keystore -out vikma-upload.keystore.base64.txt -A
          echo BASE64_DONE
          ls -lh vikma-upload.keystore.base64.txt
          wc -c vikma-upload.keystore.base64.txt

          echo STEP5_GUIDE
          echo "VIKMA_UPLOAD_STORE_PASSWORD = $STORE_PASS" > SECRETS_GUIDE.txt
          echo "VIKMA_UPLOAD_KEY_ALIAS = vikma-upload" >> SECRETS_GUIDE.txt
          echo "VIKMA_UPLOAD_KEY_PASSWORD = $STORE_PASS" >> SECRETS_GUIDE.txt
          echo "VIKMA_UPLOAD_KEYSTORE_BASE64 = vikma-upload.keystore.base64.txt file eke thiyena agaya" >> SECRETS_GUIDE.txt
          cat SECRETS_GUIDE.txt

          echo STEP6_ZIP
          zip VIKMA-NEW-KEY-BACKUP.zip vikma-upload.keystore vikma-upload.keystore.base64.txt SECRETS_GUIDE.txt
          echo ZIP_DONE
          ls -lh
          echo ALL_DONE

      - name: Upload Backup ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VIKMA-NEW-KEY-BACKUP
          path: VIKMA-NEW-KEY-BACKUP.zip
          if-no-files-found: warn
